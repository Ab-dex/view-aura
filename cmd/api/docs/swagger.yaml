      security:
      - BearerAuth: []
      summary: Confirm TOTP enrollment
      tags:
      - Auth
  /auth/mfa/totp/enroll:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authTOTPEnrollResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      security:
      - BearerAuth: []
      summary: Enroll TOTP
      tags:
      - Auth
  /auth/mfa/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: User ID, code, method
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authVerifyMFARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      summary: Verify MFA code
      tags:
      - Auth
  /auth/oauth/{provider}/begin:
    get:
      parameters:
      - description: 'Provider: google | apple'
        in: path
        name: provider
        required: true
        type: string
      - description: Callback URI
        in: query
        name: redirect_uri
        required: true
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      summary: Begin OAuth flow
      tags:
      - Auth
  /auth/oauth/{provider}/callback:
    get:
      parameters:
      - description: 'Provider: google | apple'
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: CSRF state
        in: query
        name: state
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      summary: OAuth callback
      tags:
      - Auth
  /auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      parameters:
      - description: Token and new password
