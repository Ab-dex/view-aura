      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      security:
      - BearerAuth: []
      summary: Disable MFA
      tags:
      - Auth
  /auth/mfa/email-otp/send:
    post:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authUserIDRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      summary: Send email OTP
      tags:
      - Auth
  /auth/mfa/totp/confirm:
    post:
      consumes:
      - application/json
      parameters:
      - description: 6-digit code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authTOTPConfirmRequest'
      produces:
      - application/json
      responses:
