          $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
        "403":
          description: Account locked or suspended
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /auth/logout/all:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout all devices
      tags:
      - Auth
  /auth/me/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: Old and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authChangePasswordRequest'
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      security:
      - BearerAuth: []
