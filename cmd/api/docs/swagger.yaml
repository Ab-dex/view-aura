        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      security:
      - BearerAuth: []
      summary: List active sessions
      tags:
      - Auth
  /auth/me/sessions/{id}:
    delete:
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Ab-dex_view-aura_internal_modules_auth_api_http.authErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke session
      tags:
      - Auth
  /auth/mfa:
