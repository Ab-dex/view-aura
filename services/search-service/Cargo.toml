[package]
name        = "search-service"
version     = "0.1.0"
edition     = "2021"
description = "ViewAura search service — MeiliSearch wrapper with Kafka consumer"

[[bin]]
name = "search-service"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio          = { version = "1", features = ["full"] }

# HTTP server
axum           = { version = "0.7", features = ["json"] }
tower          = { version = "0.5" }
tower-http     = { version = "0.5", features = ["cors", "trace", "request-id", "timeout"] }

# MeiliSearch client
meilisearch-sdk = "0.27"

# Kafka consumer (rdkafka wraps librdkafka — same C lib as the Go producer)
rdkafka        = { version = "0.36", features = ["cmake-build", "ssl", "sasl"] }

# Redis (autocomplete ZSet warm-up)
redis          = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Serialisation
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

# Config / env
config         = "0.14"
dotenvy        = "0.15"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry      = { version = "0.22" }
opentelemetry_sdk  = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.23"

# Error handling
anyhow    = "1"
thiserror = "1"

# Utilities
uuid      = { version = "1", features = ["v4"] }
chrono    = { version = "0.4", features = ["serde"] }
once_cell = "1"

[dev-dependencies]
axum-test  = "0.3"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
strip     = "symbols"