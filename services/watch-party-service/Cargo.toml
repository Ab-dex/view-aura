[package]
name        = "watch-party-service"
version     = "0.1.0"
edition     = "2021"
description = "ViewAura Watch Party Service — WebSocket sync, live chat, 1M+ concurrent connections"

[[bin]]
name = "watch-party-service"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio       = { version = "1", features = ["full"] }

# HTTP + WebSocket server
axum        = { version = "0.7", features = ["json", "ws"] }
axum-extra  = { version = "0.9" }
tower       = "0.5"
tower-http  = { version = "0.5", features = ["cors", "trace", "request-id", "timeout"] }

# WebSocket protocol
tokio-tungstenite = "0.23"

# Redis — pub/sub fan-out + party state
redis       = { version = "0.25", features = [
    "tokio-comp",
    "connection-manager",
    "aio",
] }

# JWT validation (RS256) — same algorithm as the Go monolith
jsonwebtoken = "9"

# Serialisation
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Config
config      = "0.14"
dotenvy     = "0.15"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid        = { version = "1", features = ["v4"] }
chrono      = { version = "0.4", features = ["serde"] }
anyhow      = "1"
thiserror   = "1"
once_cell   = "1"
dashmap     = "6"          # concurrent hashmap for in-process connection registry
futures     = "0.3"
bytes       = "1"

[dev-dependencies]
axum-test   = "0.3"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = "symbols"