# Kafka topic configuration applied via kafka-topics.sh or the Strimzi
# KafkaTopic CRD when running on Kubernetes with the Strimzi operator.
#
# Partition count follows the PRD:
#   Hot topics (ratings, watch_events) → 64-128 partitions
#   Standard topics                    → 16-32 partitions
#   Low-volume topics                  → 8 partitions
#
# Retention follows event consumer requirements:
#   Long-lived replay topics           → 30d (workflow_events, watch_events)
#   Standard                           → 7d
#   High-frequency analytics           → 3d (notifications)
#   Box office / compliance            → 90d

---
# user.events
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: user-events
  namespace: viewaura-infra
  labels:
    strimzi.io/cluster: viewaura-kafka
spec:
  partitions: 32
  replicas: 3
  config:
    retention.ms: "604800000"         # 7 days
    cleanup.policy: delete
    compression.type: snappy
    min.insync.replicas: "2"

