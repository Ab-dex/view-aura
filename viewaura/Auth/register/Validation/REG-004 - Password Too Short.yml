info:
  name: Register - Password Too Short
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "david.solemn@gmail.com",
        "password": "Pass1@",
        "display_name": "Solemnseagal",
        "first_name": "David",
        "last_name": "Solemn",
        "user_name": "solemn_dev"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        expect(res.status).to.equal(400);
        expect(res.body.message).to.include("password");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Test ID: REG-004
  Category: Negative
  Description: Failed registration with password under 8 characters (binding: min=8)
  Expected: 400 Bad Request, error references "password"