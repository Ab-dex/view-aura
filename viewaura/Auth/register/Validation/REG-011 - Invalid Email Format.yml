info:
  name: Register - Invalid Email Format
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "not-a-valid-email",
        "password": "Password1@",
        "display_name": "Solemnseagal",
        "first_name": "David",
        "last_name": "Solemn",
        "user_name": "solemn_dev"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        expect(res.status).to.equal(400);
        expect(res.body.message).to.include("email");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Test ID: REG-011
  Category: Negative
  Description: Failed registration with malformed email (no @ symbol)
  Expected: 400 Bad Request, error references "email"