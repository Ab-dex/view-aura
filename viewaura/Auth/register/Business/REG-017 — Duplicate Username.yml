info:
  name: Register - Duplicate Username
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "completely.new@gmail.com",
        "password": "Password1@",
        "display_name": "AnotherUser",
        "first_name": "Another",
        "last_name": "User",
        "user_name": "solemn_dev"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        expect(res.status).to.equal(409);
        expect(res.body.message).to.include("user_name");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Test ID: REG-017
  Category: Negative
  Description: Failed registration using a username already taken by an existing account
  Precondition: An account with user_name "solemn_dev" already exists (e.g. seeded by REG-001)
  Expected: 409 Conflict, error references "user_name"