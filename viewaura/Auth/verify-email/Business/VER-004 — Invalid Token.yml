info:
  name: Verify Email - Invalid Token
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/verify-email"
  body:
    type: json
    data: |-
      {
        "token": "this-is-not-a-real-token-abc123"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Check verify email fails with invalid token", function() {
          expect(res.status).to.equal(400);
        });

        test("Check response contains error message", function() {
          expect(res.body).to.have.property("message");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Test ID: VER-004
  Category: Negative
  Description: Failed verification with a token that does not exist or has been tampered with
  Expected: 400 Bad Request, service layer rejects unknown token