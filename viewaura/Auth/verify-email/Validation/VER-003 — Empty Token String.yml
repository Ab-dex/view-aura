info:
  name: Verify Email - Empty Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/verify-email"
  body:
    type: json
    data: |-
      {
        "token": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Check verify email fails with empty token string", function() {
          expect(res.status).to.equal(400);
        });

        test("Check error message references token field", function() {
          expect(res.body.message).to.include("token");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Test ID: VER-003
  Category: Negative
  Description: Failed verification with token present but set to empty string (binding: required treats "" as missing)
  Expected: 400 Bad Request, error references "token"