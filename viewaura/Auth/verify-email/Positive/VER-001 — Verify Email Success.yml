info:
  name: Verify Email - Success
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/verify-email"
  body:
    type: json
    data: |-
      {
        "token": "{{validVerificationToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Check verify email succeeds with valid token", function() {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Test ID: VER-001
  Category: Positive
  Description: Successful email verification with a valid token
  Precondition: A valid verification token exists in {{validVerificationToken}} env variable
  Expected: 204 No Content